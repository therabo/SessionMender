[package]
name = "agentmender-provider-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
agentmender-domain.workspace = true
thiserror.workspace = true
tempfile.workspace = true
uuid.workspace = true
[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }
[target.'cfg(windows)'.dependencies]
serde_json.workspace = true
winapi-util = "0.1.11"
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Com", "Win32_System_IO", "Win32_UI_Shell"] }

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"
