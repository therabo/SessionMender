name: Local session manager
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: npm run test:startup
        env:
          RUSTUP_TOOLCHAIN: stable
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +stable build --locked --workspace
      - run: cargo +stable test --locked --workspace
      - name: Exercise macOS Codex removal in a confined archive
        if: runner.os == 'macOS'
        run: |
          native="$RUNNER_TEMP/sessionmender-codex"
          npm install --prefix "$native" --no-audit --no-fund '@openai/codex@0.171.0-alpha.13'
          export SESSIONMENDER_TEST_CODEX="$(find "$native" -type f -name codex -print -quit)"
          test -x "$SESSIONMENDER_TEST_CODEX"
          npm run test:macos --prefix ui
      - name: Exercise the Windows backend and browser with isolated archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $native = Join-Path $env:RUNNER_TEMP sessionmender-codex
          npm install --prefix $native --no-audit --no-fund '@openai/codex@0.171.0-alpha.13'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:SESSIONMENDER_TEST_CODEX = (Get-ChildItem $native -Recurse -Filter codex.exe |
            Select-Object -First 1).FullName
          $env:SESSIONMENDER_TEST_CHROMIUM = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) |
            ForEach-Object { Join-Path $_ 'Microsoft/Edge/Application/msedge.exe' } |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          npm run test:windows --prefix ui
